{% extends 'books/base.html' %}
{% block title %}Book list{% endblock %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <!-- Filtering form -->
        <form method="get" action="{% url 'books:books' %}" class="mb-4">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" name="q" class="form-control" placeholder="Searching" value="{{ request.GET.q }}">
                </div>
                <div class="col-md-3">
                    <select name="genres" class="form-control">
                        <option value="">All genres</option>
                        {% for genre in filter.form.genres.field.queryset %}
                            <option value="{{ genre.id }}" {% if request.GET.genres == genre.id|stringformat:"s" %}selected{% endif %}>{{ genre.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                </div>
            </div>
        </form>
        <h3>Books</h3>
        <div class="col-12 d-flex justify-content-between align-items-center mt-3 mb-3">
            <a class="btn btn-secondary" href="{% url 'books:home' %}">
                Home
            </a>
            {% if user.is_staff %}
            <a class="btn btn-primary" href="{% url 'books:book-create' %}" role="button">
                Add New
            </a>
            {% endif %}
        </div>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <table class="table">
                <thead>
                    <tr>
                        <th>
                            Name
                        </th>
                    </tr>
                </thead>
                <tbody>
                {% for book in books %}
                    <tr>
                        <td>
                            <a href="{% url 'books:book-detail' book.pk %}">{{ book.title }} - {{book.author.name}}</a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
        {% include 'books/includes/pagination.html' %}
    </div>
</div>
{% endblock %}
