{% extends 'books/base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="container">
    <h2 class="mt-5 text-center">Book recommendations service</h2>
    <div class="row d-flex justify-content-center align-items-center mt-3 mb-3">
        <div class="col-4 text-center">
            {% if user.is_staff %}
            <a href="{% url 'books:genres' %}" class="btn btn-primary mt-2 mb-2">Genres</a>
            <a href="{% url 'books:authors' %}" class="btn btn-primary mt-2 mb-2">Authors</a>
            {% endif %}
            {% if user.is_authenticated %}
            <a href="{% url 'books:books' %}" class="btn btn-primary mt-2 mb-2">Books</a>
            <a href="{% url 'books:statistics' %}" class="btn btn-primary mt-2 mb-2">Statistics</a>
            <a href="{% url 'books:recommendations' %}" class="btn btn-primary mt-2 mb-2">Recommendations</a>
            {% else %}
            <a href="{% url 'users:login' %}" class="btn btn-primary mt-2 mb-2">Login</a>
            <a href="{% url 'users:register' %}" class="btn btn-primary mt-2 mb-2">Sign Up</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
