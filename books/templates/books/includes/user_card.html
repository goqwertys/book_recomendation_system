<div class="card mb-3">
    <div class="row g-0">
        <div class="col-md-3">
            {% if user.profile.avatar %}
            <img src="{{ user.profile.avatar }}" class="img-fluid rounded-circle" alt="User Avatar">
            {% else %}
            <div class="no-cover">
                {{ user.email }}
            </div>
            {% endif %}
        </div>
        <div class="col-md-9">
            <div class="card-body">
                <h5 class="card-title">{{ user.email }}</h5>
                <p class="card-text">Recommended based on similarity.</p>
                <a href="{% url 'users:profile' user.pk %}" class="btn btn-info">View Profile</a>
            </div>
        </div>
    </div>
</div>
